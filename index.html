<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BingrAnime — Discover Anime</title>
<meta name="description" content="Discover trending, popular and top-rated anime. Powered by AniList. Legal watch links only." />
<meta name="theme-color" content="#0f1014" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1014'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23e50914' font-family='Arial Black'%3EB%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://graphql.anilist.co" crossorigin />
</head>
<body>
<header class="topbar">
  <div class="brand">Bingr<span>Anime</span></div>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search anime… (e.g. Frieren, One Piece)" autocomplete="off" />
    <div id="results" class="dropdown hidden"></div>
  </div>
  <a class="pill" href="https://anilist.co" target="_blank" rel="noopener">AniList</a>
</header>

<section id="hero" class="hero">
  <div class="hero-bg"></div>
  <div class="hero-body">
    <div class="kicker">✨ Spotlight</div>
    <h1 id="hero-title">Loading…</h1>
    <div id="hero-meta" class="meta"></div>
    <p id="hero-desc"></p>
    <div class="hero-actions">
      <button id="hero-info">More info</button>
      <a id="hero-anilist" target="_blank" rel="noopener">View on AniList →</a>
    </div>
  </div>
</section>

<main>
  <section class="row"><h2>Trending Now</h2><div id="row-trending" class="cards"></div></section>
  <section class="row"><h2>Popular This Season</h2><div id="row-popular" class="cards"></div></section>
  <section class="row"><h2>Top Rated All Time</h2><div id="row-top" class="cards"></div></section>
  <p class="note">Catalog by <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a> • Covers &amp; synopses belong to their owners • This demo links to legal sources only (AniList / official external links). No hosted video.</p>
</main>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <button id="close" aria-label="Close">✕</button>
    <div id="modal-body">Loading…</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
